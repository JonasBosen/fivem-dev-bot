# Render Blueprint: Dashboard -> New -> Blueprint -> vælg dette repo.
# Render opretter tjenesten og beder dig udfylde de hemmelige værdier (sync: false).
services:
  - type: web
    name: fivem-dev-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DEV_ROLE_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: REVIEW_CHANNEL_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
