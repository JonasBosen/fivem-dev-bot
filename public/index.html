<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev-panel</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --card: #1e222b; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a5; --accent: #5865f2;
    --todo: #e74c3c; --doing: #f1c40f; --done: #2ecc71; --rejected: #7f8c8d;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f4f7; --panel: #ffffff; --card: #f8f9fb; --border: #dde0e7; --text: #1b1e25; --muted: #667085; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  input, textarea { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; width: 100%; }
  header input { width: 220px; }
  button { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.good { background: var(--done); border-color: var(--done); color: #072; }
  button.danger { background: transparent; border-color: var(--todo); color: var(--todo); }
  .who { color: var(--muted); font-size: 13px; }
  #login { max-width: 380px; margin: 14vh auto; text-align: center; padding: 28px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  #login p { color: var(--muted); }
  #login a { display: inline-block; margin-top: 8px; padding: 10px 18px; background: var(--accent); color: #fff; border-radius: 8px; text-decoration: none; }
  #board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; padding: 16px; align-items: start; overflow-x: auto; }
  .col { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px; min-height: 120px; }
  .col h2 { font-size: 14px; margin: 2px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
  .col h2 .n { color: var(--muted); font-weight: 400; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer; }
  .card:hover { border-color: var(--accent); border-left-color: var(--c); }
  .card .t { font-weight: 600; word-break: break-word; }
  .card .m { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 4px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(620px, 94vw); max-height: 90vh; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .dlg { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .dlg h3 { margin: 0; font-size: 17px; word-break: break-word; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; border: 1px solid var(--border); }
  .desc { white-space: pre-wrap; word-break: break-word; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .lbl { color: var(--muted); font-size: 12.5px; margin-bottom: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .log { max-height: 190px; overflow: auto; font-size: 13px; border-top: 1px solid var(--border); padding-top: 8px; }
  .log div { padding: 3px 0; }
  .log .time { color: var(--muted); }
  .err { color: var(--todo); font-size: 13px; min-height: 1em; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); padding: 9px 16px; border-radius: 8px; display: none; z-index: 20; }
  @media (max-width: 900px) { #board { grid-template-columns: 1fr; } header input { width: 100%; } }
</style>
</head>
<body>

<div id="login" hidden>
  <h2>📋 Dev-panel</h2>
  <p>Log ind med Discord. Kun udviklere har adgang.</p>
  <a href="/auth/login">Log ind med Discord</a>
</div>

<div id="app" hidden>
  <header>
    <h1>📋 Dev-panel</h1>
    <input id="search" type="search" placeholder="Søg i opgaver…">
    <button class="primary" id="newBtn">➕ Ny opgave</button>
    <span class="who" id="who"></span>
    <a class="who" href="/auth/logout">Log ud</a>
  </header>
  <main id="board"></main>
</div>

<dialog id="taskDlg"><div class="dlg" id="taskBody"></div></dialog>

<dialog id="noteDlg">
  <form method="dialog" class="dlg" id="noteForm">
    <h3 id="noteTitle"></h3>
    <textarea id="noteText" rows="4" maxlength="1000" required></textarea>
    <div class="err" id="noteErr"></div>
    <div class="actions">
      <button type="submit" class="primary" id="noteOk">Gem</button>
      <button type="button" id="noteCancel">Annullér</button>
    </div>
  </form>
</dialog>

<dialog id="newDlg">
  <form method="dialog" class="dlg" id="newForm">
    <h3>Ny opgave</h3>
    <input id="newTitle" maxlength="100" placeholder="Titel" required>
    <textarea id="newDesc" rows="5" maxlength="1500" placeholder="Beskrivelse (valgfri)"></textarea>
    <div class="err" id="newErr"></div>
    <div class="actions">
      <button type="submit" class="primary">Opret</button>
      <button type="button" id="newCancel">Annullér</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
const STATUS = {
  todo:     { label: 'Ikke startet', color: 'var(--todo)' },
  doing:    { label: 'I gang',       color: 'var(--doing)' },
  done:     { label: 'Færdig',       color: 'var(--done)' },
  rejected: { label: 'Afvist',       color: 'var(--rejected)' },
};
const $ = (id) => document.getElementById(id);
let tasks = [];
let openId = null;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}

const fmt = (d) => new Date(d).toLocaleString('da-DK', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 2500);
}

async function api(url, method = 'GET', body) {
  const r = await fetch(url, {
    method, credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 || r.status === 403) { showLogin(); throw new Error('Ikke logget ind'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Der skete en fejl');
  return data;
}

function showLogin() { $('app').hidden = true; $('login').hidden = false; }

/* ---------- Board ---------- */

function renderBoard() {
  const q = $('search').value.trim().toLowerCase();
  const board = $('board');
  board.replaceChildren();
  for (const [key, s] of Object.entries(STATUS)) {
    const list = tasks.filter((t) => t.status === key &&
      (!q || `#${t.id} ${t.title} ${t.description} ${t.assigneeName || ''}`.toLowerCase().includes(q)));
    const col = h('section', { class: 'col' },
      h('h2', {}, h('span', {}, h('span', { class: 'dot', style: `background:${s.color}` }), s.label), h('span', { class: 'n' }, list.length)));
    if (!list.length) col.append(h('div', { class: 'empty' }, 'Ingen opgaver'));
    for (const t of list) {
      col.append(h('div', { class: 'card', style: `--c:${s.color}`, onclick: () => openTask(t.id) },
        h('div', { class: 't' }, `#${t.id} `, t.source === 'ticket' ? '🎫 ' : '', t.title),
        h('div', { class: 'm' }, t.assigneeName ? `👤 ${t.assigneeName} · ` : '', fmt(t.updatedAt))));
    }
    board.append(col);
  }
}

async function loadTasks() {
  try {
    tasks = await api('/api/tasks');
    $('login').hidden = true; $('app').hidden = false;
    renderBoard();
  } catch (e) { /* login vises i api() */ }
}

/* ---------- Opgave-dialog ---------- */

async function openTask(id) {
  openId = id;
  try {
    const t = await api(`/api/tasks/${id}`);
    renderTask(t);
    if (!$('taskDlg').open) $('taskDlg').showModal();
  } catch (e) { toast(e.message); }
}

function renderTask(t) {
  const s = STATUS[t.status];
  const body = $('taskBody');
  body.replaceChildren();
  body.append(
    h('h3', {}, `#${t.id} · ${t.title}`),
    h('div', {}, h('span', { class: 'badge', style: `border-color:${s.color}` }, s.label), ' ',
      h('span', { class: 'badge' }, t.source === 'ticket' ? '🎫 Borger-ticket' : '🛠️ Intern')),
    h('div', { class: 'who' }, `Oprettet af ${t.createdByName || 'ukendt'} · ${fmt(t.createdAt)}`, t.assigneeName ? ` · Taget af ${t.assigneeName}` : ''),
    h('div', {}, h('div', { class: 'lbl' }, 'Beskrivelse'), h('div', { class: 'desc' }, t.description || 'Ingen beskrivelse')),
  );
  if (t.extra) body.append(h('div', {}, h('div', { class: 'lbl' }, 'Ekstra info'), h('div', { class: 'desc' }, t.extra)));
  if (t.note) body.append(h('div', {}, h('div', { class: 'lbl' }, t.status === 'rejected' ? 'Begrundelse' : 'Hvad der er gjort'), h('div', { class: 'desc' }, t.note)));

  const act = h('div', { class: 'actions' });
  const btn = (label, cls, fn) => act.append(h('button', { class: cls, onclick: fn }, label));
  if (t.status === 'todo') { btn('Opgave taget', 'primary', () => doAction(t.id, 'take')); btn('Afvis', 'danger', () => askNote(t.id, 'reject')); }
  else if (t.status === 'doing') { btn('Opgave færdig', 'good', () => askNote(t.id, 'done')); btn('Slip opgave', '', () => doAction(t.id, 'release')); btn('Afvis', 'danger', () => askNote(t.id, 'reject')); }
  else btn('Genåbn', '', () => doAction(t.id, 'reopen'));
  btn('Luk', '', () => $('taskDlg').close());
  body.append(act, h('div', { class: 'err', id: 'taskErr' }));

  const log = h('div', { class: 'log' }, h('div', { class: 'lbl' }, 'Log'));
  for (const l of [...t.log].reverse()) {
    log.append(h('div', {}, h('span', { class: 'time' }, fmt(l.at) + ' '), h('b', {}, l.action), ` – ${l.userName || 'ukendt'}`, l.text ? `: ${l.text}` : ''));
  }
  body.append(log);
}

async function doAction(id, action, note) {
  try {
    const t = await api(`/api/tasks/${id}/${action}`, 'POST', { note });
    renderTask(t);
    toast('Gemt ✅');
    await loadTasks();
    return true;
  } catch (e) {
    const el = $('taskErr'); if (el) el.textContent = e.message;
    return e.message;
  }
}

/* ---------- Note-dialog (færdig / afvis) ---------- */

let pending = null;
function askNote(id, action) {
  pending = { id, action };
  $('noteTitle').textContent = action === 'done' ? `Færdigmeld #${id} – hvad er der gjort?` : `Afvis #${id} – hvorfor?`;
  $('noteText').value = ''; $('noteErr').textContent = '';
  $('noteDlg').showModal();
  $('noteText').focus();
}
$('noteCancel').onclick = () => $('noteDlg').close();
$('noteForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const note = $('noteText').value.trim();
  if (!note) { $('noteErr').textContent = 'Skriv en tekst'; return; }
  $('noteOk').disabled = true;
  const r = await doAction(pending.id, pending.action, note);
  $('noteOk').disabled = false;
  if (r === true) $('noteDlg').close(); else $('noteErr').textContent = r;
});

/* ---------- Ny opgave ---------- */

$('newBtn').onclick = () => { $('newTitle').value = ''; $('newDesc').value = ''; $('newErr').textContent = ''; $('newDlg').showModal(); $('newTitle').focus(); };
$('newCancel').onclick = () => $('newDlg').close();
$('newForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/api/tasks', 'POST', { title: $('newTitle').value, description: $('newDesc').value });
    $('newDlg').close(); toast('Opgave oprettet ✅');
    await loadTasks();
  } catch (err) { $('newErr').textContent = err.message; }
});

/* ---------- Start ---------- */

$('search').addEventListener('input', renderBoard);
(async () => {
  try {
    const me = await api('/api/me');
    $('who').textContent = me.name;
    await loadTasks();
    setInterval(() => { if (!document.hidden && !$('noteDlg').open && !$('newDlg').open) loadTasks(); }, 10000);
  } catch (e) { showLogin(); }
})();
</script>
</body>
</html>
